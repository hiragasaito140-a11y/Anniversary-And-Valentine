<!DOCTYPE html>
<html>
<head>
    <title>Happy Anniversary and Valentine 💖</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #ffe6f0;
            overflow: hidden;
            transition: 0.5s;
        }

        h1 {
            margin-top: 100px;
            font-size: 40px;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            margin: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
        }

        #noBtn {
            background-color: #999;
            color: white;
            position: absolute;
        }

        .floating {
            position: absolute;
            font-size: 24px;
            animation: floatUp 3s linear infinite;
        }

        @keyframes floatUp {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(-200px); opacity: 0; }
        }
    </style>
</head>
<body>

<h1 id="question">Mau jadi Valentine aku? 💕</h1>

<button id="yesBtn">Iya ❤️</button>
<button id="noBtn">Enggak 😒</button>

<script>
document.addEventListener("DOMContentLoaded", function() {

let noClickCount = 0;
let yesClickCount = 0;

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const question = document.getElementById("question");

noBtn.style.left = "55%";
noBtn.style.top = "60%";

// NO CHAOS
noBtn.addEventListener("mouseover", function() {
    if (noClickCount >= 1) {
        const x = Math.random() * (window.innerWidth - 120);
        const y = Math.random() * (window.innerHeight - 60);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    }
});

noBtn.addEventListener("click", function() {
    noClickCount++;
    yesBtn.style.transform = "scale(" + (1 + noClickCount * 0.3) + ")";
});

// YES CHAOS
yesBtn.addEventListener("click", function() {
    yesClickCount++;

    if (yesClickCount === 1) {
        question.innerText = "Serius nih mau?? 😳💕";
        document.body.style.backgroundColor = "#ffb3c6";
        yesBtn.style.transform = "scale(1.3)";
    }
    else if (yesClickCount === 2) {
        question.innerText = "GAK BOLEH NARIK OMONGAN YA 😤❤️";
        document.body.style.backgroundColor = "#ff4d6d";
        yesBtn.style.transform = "scale(1.6)";
    }
    else if (yesClickCount >= 3) {

        // Efek hati beterbangan
        for (let i = 0; i < 20; i++) {
            let heart = document.createElement("div");
            heart.innerHTML = "💖";
            heart.className = "floating";
            heart.style.left = Math.random() * window.innerWidth + "px";
            heart.style.top = Math.random() * window.innerHeight + "px";
            document.body.appendChild(heart);
        }

        // Tampilkan video
        document.body.innerHTML = `
            <h1>YEAYYY ❤️❤️❤️</h1>
            <h2>Kamu resmi jadi Valentine aku 😘</h2>
            <iframe 
                src="https://drive.google.com/file/d/1k5N1qXKZ5YckVdN3Euj8BIbkKDEm7wCA/preview"
                width="800"
                height="450"
                allow="autoplay"
                style="border:none;">
            </iframe>
        `;
    }
});

});
</script>

</body>
</html>
